# PostgreSQL configuration.
#
# Development and test connect to a local PostgreSQL server. Set the password
# once per Windows user (then restart the terminal/editor):
#
#   [Environment]::SetEnvironmentVariable(
#     'VOLUNTEERMATCH_DATABASE_PASSWORD', '<password>', 'User')
#
# Production reads the whole connection from DATABASE_URL, for example:
#
#   DATABASE_URL=postgres://user:pass@db-host:5432/volunteermatch_production
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

local: &local
  <<: *default
  # Use IPv4 explicitly on Windows to avoid intermittent localhost/IPv6 issues.
  host: <%= ENV.fetch("VOLUNTEERMATCH_DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("VOLUNTEERMATCH_DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("VOLUNTEERMATCH_DATABASE_USERNAME", "postgres") %>
  password: <%= ENV["VOLUNTEERMATCH_DATABASE_PASSWORD"] %>

development:
  <<: *local
  database: VolunteerMatch_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *local
  database: VolunteerMatch_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
